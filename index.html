<script>
// 買い物リストの中核処理。
// ブラウザからもNode（テスト）からも同じものを使うため、DOMには一切触れない。
//
// iOSアプリ版と同じ考え方で作っている。
// 分量の足し算はAIに任せず、ここで確定的に計算する。

// ---------------------------------------------------------------------------
// 文字の下ごしらえ
// ---------------------------------------------------------------------------

/** 全角の英数字・記号（U+FF01〜U+FF5E）だけを半角にする。カタカナには触らない。 */
function toHalfwidth(text) {
  let result = "";
  for (const char of text) {
    const code = char.codePointAt(0);
    if (code >= 0xff01 && code <= 0xff5e) {
      result += String.fromCodePoint(code - 0xfee0);
    } else {
      result += char;
    }
  }
  return result;
}

/** 「½」のような分数記号を、半角の分数に開く。前の空白は「1½」を「1 1/2」と読ませるため。 */
const VULGAR_FRACTIONS = {
  "½": " 1/2", "⅓": " 1/3", "⅔": " 2/3", "¼": " 1/4", "¾": " 3/4",
  "⅕": " 1/5", "⅖": " 2/5", "⅗": " 3/5", "⅘": " 4/5",
  "⅙": " 1/6", "⅚": " 5/6",
  "⅛": " 1/8", "⅜": " 3/8", "⅝": " 5/8", "⅞": " 7/8",
};

function normalizeText(text) {
  let result = toHalfwidth(String(text).trim());
  for (const [symbol, replacement] of Object.entries(VULGAR_FRACTIONS)) {
    result = result.split(symbol).join(replacement);
  }
  result = result.split("　").join(" ").trim();

  // 写真から読むと「¼」が「¼/4」のように二重に出ることがある。前だけ残す。
  result = result.replace(/(\d+\/\d+)\/\d+/g, "$1");
  // 「大さじ1/」のように分母が欠けたもの。残った斜線を落とす。
  result = result.replace(/\/\s*$/, "");
  // 「1本(80g」のように閉じ括弧が読み取れないことがある。数が合えば補う。
  const open = (result.match(/\(/g) ?? []).length;
  const close = (result.match(/\)/g) ?? []).length;
  if (open > close) result += ")".repeat(open - close);

  return result.trim();
}

/**
 * 数字と数字の間にある「と」「〜」だけを扱う。
 * 「1と1/2」は足し算、「2〜3」は範囲。材料名や単位の文字には触らない。
 */
function normalizeConnectors(text) {
  const chars = [...text];
  let result = "";

  for (let i = 0; i < chars.length; i++) {
    const char = chars[i];
    const previous = chars[i - 1];
    const next = chars[i + 1];
    const between = isDigit(previous) && isDigit(next);

    if (between && char === "と") result += " ";
    else if (between && "-~〜～–—".includes(char)) result += "~";
    else result += char;
  }
  return result;
}

function isDigit(char) {
  return char !== undefined && char >= "0" && char <= "9";
}

// ---------------------------------------------------------------------------
// 分量
// ---------------------------------------------------------------------------

/** 「大さじ2」のように単位が先に来る書き方。 */
const PREFIX_UNITS = ["大さじ", "小さじ", "カップ"];

/** 数値を持たない曖昧な表記。数値のある分量が他にあれば、こちらは落として合算する。 */
const VAGUE_QUANTITIES = [
  "少々", "少量", "適量", "適宜", "お好みで", "好みで", "ひとつまみ", "ふたつまみ",
];

/** 単位の表記ゆれ。左を右に寄せてから比較する。 */
const UNIT_ALIASES = {
  "コ": "個", "こ": "個", "ヶ": "個", "ケ": "個",
  "片": "かけ", "かけら": "かけ", "カケ": "かけ",
  "切": "切れ", "きれ": "切れ",
  "グラム": "g", "きろ": "kg", "キロ": "kg", "キログラム": "kg",
  "cc": "ml", "ミリリットル": "ml", "リットル": "l", "ℓ": "l",
  "おおさじ": "大さじ", "こさじ": "小さじ",
};

/** 材料の量ではない単位。手順の文章を材料と取り違えないために使う。 */
const TIME_AND_LENGTH_UNITS = [
  "分", "秒", "時間", "時", "日", "日間", "週間", "か月", "ヶ月", "年",
  "cm", "mm", "m", "度", "℃", "回", "人分", "人前",
];

/** 手順の文章に出てくる時間の単位。長さの cm などは材料にも使うので含めない。 */
const TIME_UNITS = ["分", "秒", "時間", "時", "日", "週間", "か月", "ヶ月", "年"];

/** レシピ情報の見出し。ページの飾りであって材料ではない。 */
const NOT_INGREDIENT_NAMES = [
  "容量", "日持ち", "保存", "分量", "カロリー", "エネルギー", "塩分", "費用",
  "調理時間", "冷蔵", "冷凍", "常温",
];

/** 単位の末尾に付きやすい飾り。「1かけ分」＝「1かけ」。 */
const UNIT_SUFFIXES = ["分", "程度", "くらい", "ぐらい", "ほど", "位", "弱", "強"];

function canonicalUnit(raw) {
  let unit = raw.trim();
  if (!unit) return "";

  // 「2人分」の「分」は飾りではないので、そのまま残す。
  if (unit === "人分" || unit === "人前") return unit;

  let stripped = true;
  while (stripped) {
    stripped = false;
    for (const suffix of UNIT_SUFFIXES) {
      if ([...unit].length > 1 && unit.endsWith(suffix)) {
        unit = unit.slice(0, -suffix.length);
        stripped = true;
      }
    }
  }

  if (/^[A-Za-z]+$/.test(unit)) unit = unit.toLowerCase();
  return UNIT_ALIASES[unit] ?? unit;
}

/** 「2」「1/2」「1 1/2」「2.5」「2~3」を数値にする。範囲は多いほうを採る。 */
function parseNumber(text) {
  const normalized = normalizeText(text);
  if (!normalized) return null;

  let total = 0;
  for (const component of normalized.split(" ").filter(Boolean)) {
    if (component.includes("~")) {
      const parts = component.split("~");
      const values = parts.map(parseSimpleNumber);
      if (values.some((v) => v === null)) return null;
      total += Math.max(...values);
    } else {
      const value = parseSimpleNumber(component);
      if (value === null) return null;
      total += value;
    }
  }
  return total;
}

function parseSimpleNumber(text) {
  if (text.includes("/")) {
    const pair = text.split("/");
    if (pair.length !== 2) return null;
    const numerator = Number(pair[0]);
    const denominator = Number(pair[1]);
    if (!isFinite(numerator) || !isFinite(denominator) || denominator === 0) return null;
    return numerator / denominator;
  }
  if (text === "" || !isFinite(Number(text))) return null;
  return Number(text);
}

/** 「1本(30g)」のように、主となる分量と括弧内の補足に分ける。 */
function splitNote(text) {
  const open = text.indexOf("(");
  if (open === -1) return [text, null];
  const close = text.indexOf(")", open);
  if (close === -1) return [text, null];

  const note = text.slice(open + 1, close).trim();
  const main = (text.slice(0, open) + text.slice(close + 1)).trim();
  return [main, note];
}

/** 「200g」「大さじ2」を数値と単位に分ける。 */
function parseValueUnit(text) {
  let rest = text.trim();
  if (!rest) return null;

  for (const prefix of ["約", "およそ", "合計", "計", "全部で", "各"]) {
    if (rest.startsWith(prefix)) rest = rest.slice(prefix.length).trim();
  }

  for (const unit of PREFIX_UNITS) {
    if (rest.startsWith(unit)) {
      const value = parseNumber(rest.slice(unit.length));
      return value === null ? null : { value, unit };
    }
  }

  // レシピサイトでよくある略記。「大1」＝大さじ1、「小1/4」＝小さじ1/4。
  // 「大2個」のように後ろへ別の単位が続くものは略記ではないので、
  // 残りが数値だけのときに限って読み替える。
  for (const [short, full] of [["大", "大さじ"], ["小", "小さじ"]]) {
    if (rest.startsWith(short)) {
      const tail = rest.slice(short.length);
      const value = tail ? parseNumber(tail) : null;
      if (value !== null) return { value, unit: full };
    }
  }


  // 先頭の数値部分と、それに続く単位に分ける（例: 200g → 200 と g）。
  let numberPart = "";
  let unitPart = "";
  for (const char of rest) {
    if (!unitPart && "0123456789./~ ".includes(char)) numberPart += char;
    else unitPart += char;
  }

  const value = parseNumber(numberPart);
  if (value === null) return null;
  return { value, unit: canonicalUnit(unitPart) };
}

function parseAmount(quantity) {
  const text = normalizeConnectors(normalizeText(quantity));
  const [main, noteText] = splitNote(text);

  const primary = parseValueUnit(main);
  if (!primary) return null;

  return {
    value: primary.value,
    unit: primary.unit,
    note: noteText ? parseValueUnit(noteText) : null,
  };
}

/** 合算結果を読みやすい形に戻す。0.5は「1/2」のように分数で表示する。 */
function formatAmount(value, unit) {
  const whole = Math.trunc(value);
  const fraction = value - whole;

  const table = {
    13: "1/8", 17: "1/6", 20: "1/5", 25: "1/4", 33: "1/3", 38: "3/8", 40: "2/5",
    50: "1/2", 60: "3/5", 63: "5/8", 67: "2/3", 75: "3/4", 80: "4/5", 83: "5/6", 88: "7/8",
  };
  const fractionText = table[Math.round(fraction * 100)] ?? null;

  let numberText;
  if (fractionText) numberText = whole === 0 ? fractionText : `${whole} ${fractionText}`;
  else if (fraction === 0) numberText = String(whole);
  else numberText = value.toFixed(1);

  return PREFIX_UNITS.includes(unit) ? `${unit}${numberText}` : `${numberText}${unit}`;
}

/** 同じ単位の分量をまとめて1つの文字列にする。 */
function combine(amounts, unit) {
  const total = amounts.reduce((sum, a) => sum + a.value, 0);
  let text = formatAmount(total, unit);

  // 「1本(30g)」のような補足も、全部に付いていて単位が同じなら足す。
  const noteUnits = new Set(amounts.map((a) => a.note?.unit).filter((u) => u !== undefined));
  if (amounts.every((a) => a.note) && noteUnits.size === 1) {
    const noteTotal = amounts.reduce((sum, a) => sum + a.note.value, 0);
    text += `(${formatAmount(noteTotal, [...noteUnits][0])})`;
  }

  return text;
}

/**
 * 2つ以上の分量表記を1つにまとめる。単位が揃っていれば足し算する。
 *
 * 合算できなかった分量は「2個 + 4g」のように並記されるが、それを次回また渡されることがある。
 * そのため最初に「+」で分解し、並記された分量も改めて足し算の対象にする。
 */
function mergeQuantities(quantities) {
  const valid = quantities
    .flatMap((q) => String(q ?? "").split("+"))
    .map((q) => q.trim())
    .filter(Boolean);

  if (valid.length === 0) return "";

  // 1つだけのときも、「大1」→「大さじ1」のように読みやすい形に直してから返す。
  if (valid.length === 1) {
    const amount = parseAmount(valid[0]);
    // 足し算できない書き方はそのまま残すが、全角の数字だけは半角に揃える。
    return amount ? combine([amount], amount.unit) : normalizeText(valid[0]);
  }

  const amounts = valid.map(parseAmount);
  if (amounts.every(Boolean)) {
    const order = [];
    const groups = new Map();
    for (const amount of amounts) {
      if (!groups.has(amount.unit)) {
        groups.set(amount.unit, []);
        order.push(amount.unit);
      }
      groups.get(amount.unit).push(amount);
    }

    // 単位が省略されている項目（「1/2」だけ、など）は、
    // 名前のある単位が1つだけなら、その単位のものとして数える。
    const named = order.filter(Boolean);
    if (named.length <= 1) return combine(amounts, named[0] ?? "");

    // 「600g」と「2枚(550g)」のように単位が食い違うとき、
    // 括弧の中に共通の単位が書いてあれば、そちらに揃えれば足せる。
    const noteUnits = new Set(amounts.map((a) => a.note?.unit).filter(Boolean));
    for (const unit of noteUnits) {
      const converted = amounts.map((a) => {
        if (a.unit === unit) return { value: a.value, unit, note: null };
        if (a.note?.unit === unit) return { value: a.note.value, unit, note: null };
        return null;
      });
      if (converted.every(Boolean)) return combine(converted, unit);
    }

    // 単位が本当に違う場合でも、同じ単位どうしは足しておく（2個 + 4g など）。
    return order.map((unit) => combine(groups.get(unit), unit)).join(" + ");
  }

  // 「少々」のように数えられない表記が混ざっているだけなら、それを外して合算する。
  const numeric = valid.filter((q) => !VAGUE_QUANTITIES.some((v) => q.includes(v)));
  if (numeric.length < valid.length && numeric.length > 0) return mergeQuantities(numeric);

  return [...new Set(valid)].join(" + ");
}

  .flatMap(([category, words]) => words.map((word) => [word, category]))
  .sort((a, b) => b[0].length - a[0].length);

/** 材料名から売り場を推測する。当てはまらなければ「その他」。 */
function categorize(name) {
  const target = normalizeText(name);
  for (const [word, category] of KEYWORD_TABLE) {
    if (target.includes(word)) return category;
  }
  return "その他";
}

function categoryIndex(category) {

  return index === -1 ? CATEGORIES.length : index;

// ---------------------------------------------------------------------------
// レシピ本文の切り出し
// ---------------------------------------------------------------------------

const INGREDIENT_HEADINGS = ["材料", "材料・調味料"];
const END_HEADINGS = [
  "作り方", "つくり方", "作りかた", "手順", "調理手順", "下ごしらえ",
  "ポイント", "コツ", "メモ", "このレシピの生い立ち", "レシピの生い立ち",
];
const NOISE_LINES = new Set([
  "menu", "search", "copy", "share", "recipe", "home", "top", "pr", "ad",
  "広告", "スポンサーリンク", "もくじ", "目次", "シェア", "ツイート", "保存",
  "お気に入り", "印刷", "コメント", "レビュー", "検索", "ログイン", "会員登録",
]);

function strippedHeading(line) {
  return line
    .split(" ").join("")
    .split("　").join("")
    .replace(/^[＜＞<>【】「」『』■□●○◆◇★☆・:：]+/, "")
    .replace(/[＜＞<>【】「」『』■□●○◆◇★☆・:：]+$/, "");
}

/** 「RECIPE RECIPE RECIPE」のように同じ語が続く行を1つにまとめる。 */
function collapseRepeats(line) {
  const tokens = line.split(" ").filter(Boolean);
  if (tokens.length <= 1) return line;

  const result = [];
  for (const token of tokens) {
    if (token !== result[result.length - 1]) result.push(token);
  }
  return result.join(" ");
}

function isNoise(line) {
  if (NOISE_LINES.has(line.toLowerCase())) return true;
  return ![...line].some((char) => /[\p{L}\p{N}]/u.test(char));
}

function tidy(raw) {
  const result = [];
  for (const rawLine of String(raw).split(/\r\n|\r|\n/)) {
    const line = collapseRepeats(rawLine.trim());
    if (!line || isNoise(line)) continue;
    if (line === result[result.length - 1]) continue;
    result.push(line);
  }
  return result;
}

function breadcrumbTitle(lines) {
  for (const line of lines.slice(0, 40)) {
    if (!line.includes(">")) continue;
    const parts = line.split(">").map((p) => p.trim()).filter(Boolean);
    if (parts.length < 2) continue;
    const last = parts[parts.length - 1];
    if ([...last].length < 2 || [...last].length > 40) continue;
    if (NOISE_LINES.has(last.toLowerCase())) continue;
    return last;
  }
  return null;
}

function isIngredientHeading(line) {
  const stripped = strippedHeading(line);
  if ([...stripped].length > 30) return false;
  return INGREDIENT_HEADINGS.some((h) => stripped.startsWith(h));
}

function isEndHeading(line) {
  const stripped = strippedHeading(line);
  if ([...stripped].length > 30) return false;
  return END_HEADINGS.some((h) => stripped.startsWith(h));
}

/**
 * レシピの文章から、料理名と材料欄を取り出す。
 *
 * Webページを丸ごと保存したPDFには、メニュー・広告・関連レシピ・コメントなど
 * 材料と関係のない文字が大量に含まれる。ここで材料欄だけに絞り込む。
 */
function prepareRecipe(raw) {
  const lines = tidy(raw);
  const title = breadcrumbTitle(lines);

  const start = lines.findIndex(isIngredientHeading);
  if (start === -1) {
    // 「材料」の見出しが無いときでも、「作り方」以降は材料ではない。
    // 写真から読み取った文章には見出しが入らないことが多いので、ここで切る。
    const end = lines.findIndex(isEndHeading);
    return {
      lines: end === -1 ? lines : lines.slice(0, end),
      title,
      sectionLines: [],
      foundSection: false,
    };
  }

  const searchEnd = Math.min(lines.length, start + 80);
  let end = searchEnd;
  for (let i = start + 1; i < searchEnd; i++) {
    if (isEndHeading(lines[i])) {
      end = i;
      break;
    }
  }

  return {
    lines,
    title: title ?? guessTitle(lines, start),
    sectionLines: [
      ...lines.slice(start + 1, end),
      ...recoverStrayIngredients(lines, end, Math.min(end + 15, searchEnd)),
    ],
    foundSection: end > start + 1,
  };
}

/**
 * 「作り方」より後ろに取り残された材料を拾う。
 *
 * 雑誌の2段組を写真で読むと、材料欄の続きが作り方の後ろに回ることがある。
 * 手順の文章を材料と取り違えないよう、短い行で、名前と分量に割れて、
 * その分量が本物の単位を持つものだけを拾う。「4〜5分」は単位が残らないので入らない。
 */
function recoverStrayIngredients(lines, from, to) {
  const found = [];

  for (let i = from; i < to && i < lines.length; i++) {
    const line = normalizeSeparators(lines[i]);
    const length = [...line].length;
    if (length < 3 || length > 24) continue;
    if (line.endsWith("。")) continue;
    if (isIngredientHeading(line) || isEndHeading(line)) continue;

    const split = splitNameAndQuantity(line) ?? splitAttachedQuantity(line);
    if (!split) continue;
    const name = stripMarkers(split.name);
    if (!isIngredientName(name)) continue;
    if (NOT_INGREDIENT_NAMES.some((word) => name.includes(word))) continue;

    const text = normalizeText(split.quantity);
    const vague = VAGUE_QUANTITIES.some((v) => text.startsWith(v));
    const amount = parseAmount(text);
    if (!vague && !amount?.unit) continue;
    // 「ふたをとって4〜5分」のような手順は、時間や長さの単位で見分けられる。
    if (amount && TIME_AND_LENGTH_UNITS.includes(amount.unit)) continue;

    found.push(lines[i]);
  }

  return found;
}

/** 料理名になりえない行。誌面の飾り文字やページ番号が紛れ込むのを防ぐ。 */
const TITLE_NOISE = /^(サイズ|材料|作り方|調理|下ごしらえ|保存|冷凍|半解凍|解凍|完成|memo|point)/i;

function isTitleNoise(line) {
  const text = normalizeText(line);
  const length = [...text].length;
  if (length < 2 || length > 40) return true;
  if (/^[0-9A-Za-z\s.,'"()-]+$/.test(text)) return true; // ページ番号や英字の飾り
  if (/^[0-9]/.test(text)) return true;
  if (text.endsWith("。")) return true; // 「〜にぴったり。」のような煽り文
  if (TITLE_NOISE.test(text)) return true;
  if (isQuantity(text)) return true;
  if (text.includes("人分")) return true;
  if (text.includes("分") && length < 8) return true;
  return false;
}

/**
 * パンくずが無いとき、材料欄の手前から料理名らしい行を探す。
 *
 * 雑誌の見開きを撮った写真では、大きな見出しが「鮭と小松菜の」「中華蒸し」のように
 * 2行に割れて読み取られる。直前の行が「の」「と」で終わっていれば続きとみなしてつなぐ。
 */
function guessTitle(lines, start) {
  const candidates = [];
  for (let i = start - 1; i >= 0 && i >= start - 10; i--) {
    if (isTitleNoise(lines[i])) continue;
    candidates.push(lines[i].trim());
    if (candidates.length >= 3) break;
  }
  if (candidates.length === 0) return null;

  let title = candidates[0];
  for (let i = 1; i < candidates.length; i++) {
    const previous = candidates[i];
    if (!/[のとやと・&]$/.test(previous)) break;
    if ([...previous].length + [...title].length > 40) break;
    title = previous + title;
  }
  return title;
}

// ---------------------------------------------------------------------------
// 材料の抜き出し
// ---------------------------------------------------------------------------

const MARKER_PATTERN = /^[●○◯◎▲△▼■□★☆・※＊*+\-–—:：「」『』\s]+|[\s:：・.]+$/g;

// 「A｜トマト缶」「A しょうがのせん切り」の A は、合わせ調味料をまとめる記号であって
// 材料名ではない。1文字のアルファベットに区切り記号が続く形だけを落とす。
const GROUP_MARKER = /^(?:[A-Za-zＡ-Ｚａ-ｚ][｜|:：\s]\s*|[A-EＡ-Ｅ](?=[ぁ-んァ-ヶ一-龠]))/;

/** その位置が括弧の内側かどうか。 */
function insideBrackets(text, index) {
  let depth = 0;
  for (let i = 0; i < index; i++) {
    if ("（(".includes(text[i])) depth++;
    else if ("）)".includes(text[i]) && depth > 0) depth--;
  }
  return depth > 0;
}

/** 「梅干し（メモ1）」の（メモ1）は本文への参照で、材料名の一部ではない。 */
const NAME_REFERENCE = /[（(](?:メモ|注|※|補足|注釈)[^）)]*[）)]\s*$/;

function stripMarkers(text) {
  text = text.replace(NAME_REFERENCE, "");
  let result = text.replace(MARKER_PATTERN, "").trim();
  const withoutGroup = result.replace(GROUP_MARKER, "").trim();
  if ([...withoutGroup].length >= 2) result = withoutGroup;
  return result.replace(MARKER_PATTERN, "").trim();
}

/**
 * 「酒、酢・各大さじ1」「塩、こしょう」のように1行へまとめられた材料を分ける。
 * 分けたそれぞれに同じ分量を持たせる。レシピ本の「各」はその意味で使われる。
 */
function splitSharedNames(name) {
  const base = name.replace(/[・\s]*各$/, "").trim();
  if (!base.includes("、")) return [name];

  const parts = base.split("、").map(stripMarkers).filter(Boolean);
  if (parts.length < 2) return [name];
  if (parts.some((part) => [...part].length > 12)) return [name];
  return parts;
}

/**
 * その文字列が、まるごと「分量」として読めるかどうか。
 *
 * 数字で始まるだけでは分量とみなさない。「3種のチーズ」のような材料名を
 * 捨ててしまうため、後ろに付く単位が短いことまで確かめる。
 */
function isQuantity(text) {
  const value = normalizeText(text);
  if (!value) return false;
  if (VAGUE_QUANTITIES.some((v) => value === v || value.startsWith(v))) return true;

  const amount = parseAmount(value);
  if (amount) return [...amount.unit].length <= 4;

  // 「大3粒」「小1個」の先頭は大きさの話で、大さじ・小さじではない。
  // 分量として認めたうえで、書かれたままの形で残す。買い物では「大」が要る。
  const sized = value.match(/^[大中小](.+)$/);
  if (sized) {
    const inner = parseAmount(sized[1]);
    if (inner && inner.unit && !PREFIX_UNITS.includes(inner.unit)) {
      return [...inner.unit].length <= 4;
    }
  }
  return false;
}

/** 見出しや分量表記が材料として紛れ込むのを防ぐ。 */
function isIngredientName(name) {
  const length = [...name].length;
  if (!name || length > 30) return false;
  // 「A」「B」は合わせ調味料をまとめる記号で、材料名ではない。
  if (/^[A-Za-zＡ-Ｚａ-ｚ]$/.test(name)) return false;
  if (/[＜＞<>]/.test(name)) return false;
  // 「す。鶏肉を皮目を下にして入れ、」のような手順の文章。材料名に句点は付かない。
  if (name.includes("。")) return false;
  if (name.includes("人分") || name.includes("人前")) return false;
  if (isQuantity(name)) return false;
  return !["材料", "調味料", "作り方", "つくり方", "手順", "メモ"].includes(name);
}

/**
 * 材料欄の行から、材料名と分量の組を作る。
 *
 * レシピサイトの書き方は主に2通りある。
 *   1) 「鶏もも肉  1枚」のように1行に名前と分量が並ぶ
 *   2) 「鶏もも肉」の次の行に「1枚」が来る
 * どちらでも読めるようにしている。
 */
/** 「20秒ほ」「4〜5分」のような時間。手順の文章に出てくるもので、材料の分量ではない。 */
function isTimeQuantity(quantity) {
  const amount = parseAmount(quantity);
  if (!amount || !amount.unit) return false;
  return TIME_UNITS.some((unit) => amount.unit.startsWith(unit));
}

function parseIngredients(sectionLines) {
  const results = [];
  let pending = null;

  const flush = (quantity) => {
    if (!pending) return;
    results.push({ name: pending, quantity: quantity ?? "" });
    pending = null;
  };

  const lines = sectionLines.flatMap((raw) => splitGluedIngredients(normalizeSeparators(raw)));

  for (const line of lines) {
    if (!line) continue;

    // 「＜香味だれ＞」のような小見出しは、材料ではないので区切りとして扱う。
    if (/^[＜<【].*[＞>】]/.test(line) || line.includes("人分")) {
      flush(null);
      continue;
    }

    // 行まるごとが分量なら、直前の名前に付ける。
    // これを先に見ないと、「大2」を「大」と「2」に割ってしまう。
    if (isQuantity(line)) {
      if (isTimeQuantity(line)) flush(null);
      else if (pending) flush(line);
      continue;
    }

    // 行の途中で名前と分量が分かれている場合。空白の区切りを先に見て、
    // 無ければ「玉ねぎ1個」のように続けて書かれている形を試す。
    const split = splitNameAndQuantity(line) ?? splitAttachedQuantity(line);
    if (split) {
      flush(null);
      if (isTimeQuantity(split.quantity)) continue;
      const name = stripMarkers(split.name);
      if (isIngredientName(name)) results.push({ name, quantity: split.quantity });
      continue;
    }

    const name = stripMarkers(line);
    flush(null);
    if (isIngredientName(name)) pending = name;
  }

  flush(null);

  return results.flatMap((item) =>
    splitSharedNames(item.name).map((name) => ({
      name,
      quantity: mergeQuantities([item.quantity]),
      category: categorize(name),
    })),
  );
}

/** 「鶏もも肉  1枚（約300g）」のような1行を、名前と分量に割る。 */
function splitNameAndQuantity(line) {
  // 「砂糖 大 1/2」のように分量そのものが空白を含むことがある。
  // 右端の1語だけを見ると「大」が名前に残るので、左から順に区切りを試して、
  // 後ろがまるごと分量として読める最初の位置で割る。
  const parts = line.split(/[\s　\t]+/).filter(Boolean);
  if (parts.length < 2) return null;

  for (let i = 1; i < parts.length; i++) {
    const name = parts.slice(0, i).join(" ").trim();
    const quantity = parts.slice(i).join(" ").trim();
    if (name && isQuantity(quantity)) return { name, quantity };
  }
  return null;
}

/** 分量のあとに続けて次の材料が書かれた行を割るための単位。長いものから見る。 */
const GLUE_UNITS = [
  "大さじ", "小さじ", "カップ", "パック", "切れ", "かけ", "個", "本", "枚", "束",
  "玉", "房", "缶", "袋", "尾", "丁", "株", "杯", "膳", "節", "合", "粒", "把",
  "箱", "瓶", "kg", "ml", "cc", "g", "l",
].sort((a, b) => b.length - a.length);

const GLUE_STOP = ["分", "程度", "くらい", "ぐらい", "ほど", "位", "弱", "強"];

const GLUE_PATTERN = new RegExp(
  `[0-9]+(?:\\s*[0-9]+/[0-9]+)?(?:\\.[0-9]+)?(?:${GLUE_UNITS.join("|")})` +
  `(?![0-9\\s（(）)])(?!${GLUE_STOP.join("|")})`,
  "g",
);

/**
 * 「鮭 2切れしいたけ 4個」のように、2つの材料が1行に混ざったものを割る。
 *
 * 雑誌の2段組を写真で読むと、隣の行が続きとしてつながることがある。
 * 分量の直後に数字でも括弧でもない文字が来たら、そこが次の材料の始まり。
 */
function splitGluedIngredients(line) {
  GLUE_PATTERN.lastIndex = 0;
  for (const match of line.matchAll(GLUE_PATTERN)) {
    const cut = match.index + match[0].length;
    const head = line.slice(0, cut).trim();
    const tail = line.slice(cut).trim();
    if (!head || [...tail].length < 2) continue;
    if (!splitNameAndQuantity(head) && !splitAttachedQuantity(head)) continue;
    return [head, ...splitGluedIngredients(tail)];
  }
  return [line];
}

/**
 * 分量が始まりそうな位置の目印。全角の数字と分数記号も含める。
 * 「醤油大2」を「醤油」と「大2」に割れるよう、数字が続く「大」「小」も候補にする。
 */
const QUANTITY_START = /[0-9０-９½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]|大さじ|小さじ|カップ|[大小](?=[0-9０-９])/g;

/**
 * 「玉ねぎ1個」「牛こま切れ肉200g」のように、区切りなしで分量が続く書き方を割る。
 *
 * 写真の文字認識では空白が落ちやすく、この形になることが多い。
 * ただし「3種のチーズ」のような材料名まで割ってしまうと困るので、
 * 切り出した後ろ側が本当に分量として読めるときだけ採用する。
 */
function splitAttachedQuantity(line) {
  const text = line.trim();
  if (!text) return null;

  // 「塩少々」「醤油適量」のように、数値を持たない分量が末尾に付く形。
  for (const vague of VAGUE_QUANTITIES) {
    if (text.length > vague.length && text.endsWith(vague)) {
      return { name: text.slice(0, -vague.length).trim(), quantity: vague };
    }
  }

  // 区切れそうな位置を左から順に試し、後ろ側が分量として読める最初の場所を採る。
  QUANTITY_START.lastIndex = 0;
  for (const match of text.matchAll(QUANTITY_START)) {
    const index = match.index;
    if (index <= 0) continue;
    // 「梅干し（メモ1）」の 1 は補足の番号。括弧の中では割らない。
    if (insideBrackets(text, index)) continue;

    const name = text.slice(0, index).trim();
    const quantity = text.slice(index).trim();
    if (!name || [...name].length > 20 || !quantity) continue;

    // 後ろ側が「数値＋単位」として読めない、または単位が長すぎる（＝材料名の一部）なら見送る。
    const amount = parseAmount(quantity);
    if (!amount || [...amount.unit].length > 4) continue;

    return { name, quantity };
  }
  return null;
}

/** 「玉ねぎ……1個」のような点線の区切りを、空白に直す。 */
// 材料名と分量のあいだに置かれる記号。見た目は似ていても別の文字なので全部並べる。
//   … U+2026 三点リーダー   ⋯ U+22EF 中央寄り三点   ‥ U+2025 二点リーダー
//   ・ U+30FB 中黒          • U+2022 ビュレット      ･ U+FF65 半角中黒
const SEPARATOR_RUN = /[…⋯‥•]+|[.．・･]{2,}|[:：]\s*/g;

// 中黒がひとつだけの「玉ねぎ・1個」「塩・小さじ1」。
// 「塩・こしょう」のような並列と区別するため、後ろが分量のときだけ区切りとみなす。
const SINGLE_SEPARATOR =
  /[・•･](?=[0-9]|[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]|大さじ|小さじ|カップ|[大小][0-9½⅓⅔¼¾]|各|適量|適宜|少々|少量)/g;

function normalizeSeparators(line) {
  return line
    .replace(SEPARATOR_RUN, " ")
    .replace(SINGLE_SEPARATOR, " ")
    .replace(/\s{2,}/g, " ")
    .trim();
}

// まとめ
// ---------------------------------------------------------------------------

/**
 * レシピの文章から、そのまま買い物リストに足せる形を作る。
 * 見つからなければ ingredients が空の配列で返る。
 */
function extractRecipe(raw, fallbackName = "レシピ") {
  const prepared = prepareRecipe(raw);
  const source = prepared.foundSection ? prepared.sectionLines : prepared.lines;
  const ingredients = parseIngredients(source);

  return {
    dishName: prepared.title ?? fallbackName,
    foundSection: prepared.foundSection,
    ingredients,
  };
}

/** 材料をまとめて、売り場順に並べる。同じ材料は分量を足し、レシピ名をつなぐ。 */
function mergeIngredients(ingredients) {
  const order = [];
  const groups = new Map();

  for (const ingredient of ingredients) {
    const key = normalizeName(ingredient.name);
    if (!groups.has(key)) {
      groups.set(key, []);
      order.push(key);
    }
    groups.get(key).push(ingredient);
  }

  const merged = order.map((key) => {
    const group = groups.get(key);
    const recipes = [...new Set(group.flatMap((i) => i.recipes ?? []))];
    return {
      name: displayName(key, group),
      quantity: mergeQuantities(group.map((i) => i.quantity)),
      category: group[0].category,
      recipes,
    };
  });

  return merged.sort((a, b) => {
    const diff = categoryIndex(a.category) - categoryIndex(b.category);
    return diff !== 0 ? diff : a.name.localeCompare(b.name, "ja");
  });
}

/**
 * 「½缶」が「12缶」と読まれるように、分数記号は写真から読み取ると
 * 数字2つになることがある。その形に当てはまる分量を返す。
 *
 * 本当に12個ということもあるので、勝手には直さない。画面で知らせて選ばせる。
 * gやmlのような計量の単位は、分数で書かれることがないので対象にしない。
 */
const FRACTION_LOOKALIKE = new Set([12, 13, 14, 15, 16, 18, 23, 25, 34, 35, 38, 45, 56, 58, 78]);
const COUNTABLE_UNITS = [
  "個", "本", "枚", "束", "玉", "房", "缶", "袋", "パック", "かけ", "切れ",
  "尾", "丁", "株", "片", "杯", "膳", "節", "袋",
];

function suspectFraction(quantity) {
  const text = normalizeText(quantity ?? "");
  const match = text.match(/^(大さじ|小さじ|カップ)?([1-9][0-9])(.*)$/);
  if (!match) return null;

  const prefix = match[1] ?? "";
  const digits = match[2];
  const rest = match[3];
  if (!FRACTION_LOOKALIKE.has(Number(digits))) return null;
  if (!prefix && !COUNTABLE_UNITS.some((unit) => rest.startsWith(unit))) return null;

  return `${prefix}${digits[0]}/${digits[1]}${rest}`;
}

/** 表記ゆれを吸収してから同じ材料かどうか判定する。 */
/** 写真から読むとよく入れ替わる字。同じ材料として扱えるように寄せる。 */
const NAME_CONFUSIONS = { "鷄": "鶏", "麺": "麺", "パジル": "バジル", "プロッコリー": "ブロッコリー" };

/**
 * 書き方が違うだけで、買い物では同じもの。
 *
 * カタカナはひらがなに直してから照合するので、
 * ここに書くのは「玉ねぎ／たまねぎ」のような漢字と仮名の違いだけでよい。
 * 値のほうが画面に出る名前になる。
 */
const SAME_NAMES = {
  // 野菜
  "たまねぎ": "玉ねぎ", "玉葱": "玉ねぎ", "たま葱": "玉ねぎ",
  "人参": "にんじん",
  "長葱": "長ねぎ", "ながねぎ": "長ねぎ",
  "葱": "ねぎ",
  "じゃが芋": "じゃがいも", "馬鈴薯": "じゃがいも",
  "さつま芋": "さつまいも",
  "生姜": "しょうが",
  "大蒜": "にんにく",
  "こまつな": "小松菜",
  "ほうれんそう": "ほうれん草",
  "だいこん": "大根",
  "はくさい": "白菜",
  "茄子": "なす",
  "胡瓜": "きゅうり",
  "白ねぎ": "長ねぎ",

  // 肉
  "鳥もも肉": "鶏もも肉", "とりもも肉": "鶏もも肉", "鶏腿肉": "鶏もも肉",
  "鶏胸肉": "鶏むね肉", "鳥むね肉": "鶏むね肉", "とりむね肉": "鶏むね肉",
  "豚ばら肉": "豚バラ肉",

  // 調味料など
  "しょうゆ": "醤油", "しょう油": "醤油", "正油": "醤油",
  "味噌": "みそ",
  "胡麻油": "ごま油",
  "胡麻": "ごま",
  "味醂": "みりん",
  "お酢": "酢",
  "日本酒": "酒", "料理酒": "酒",
  "胡椒": "こしょう",
  "たまご": "卵", "玉子": "卵",
  "とうふ": "豆腐",
};

/** 画面に出してよい名前（SAME_NAMES がまとめ先にしている書き方）。 */
const CANONICAL_NAMES = new Set(Object.values(SAME_NAMES));

/** カタカナをひらがなに直す。「タマネギ」と「たまねぎ」を同じものとして数えるため。 */
function toHiragana(text) {
  return text.replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
}

function normalizeName(name) {
  let result = String(name).trim().split(" ").join("").split("　").join("").toLowerCase();
  for (const [from, to] of Object.entries(NAME_CONFUSIONS)) {
    result = result.split(from).join(to);
  }
  result = toHiragana(result);
  return SAME_NAMES[result] ?? result;
}

/** まとめたあとに画面へ出す名前。書き方が割れていたら、決めた側にそろえる。 */
function displayName(key, group) {
  return CANONICAL_NAMES.has(key) ? key : group[0].name;
}

const STORAGE_KEY = "recipe-kago.v1";

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { lists: [] };
    const data = JSON.parse(raw);
    return Array.isArray(data.lists) ? data : { lists: [] };
  } catch {
    return { lists: [] };
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch {
    toast("保存できませんでした。ブラウザの空き容量を確認してください");
  }
}

const state = {
  data: load(),
  screen: "home",
  listId: null,
  draft: null,
  sheet: null,
};

// 調味料は「家にあるか」だけ分かればよく、買い物中に分量は見ない。
// 既定では隠す。作る分量を確かめたい人のために切り替えは残す。
state.data.settings ??= {};
state.data.settings.seasoningQuantity ??= false;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function currentList() {
  return state.data.lists.find((l) => l.id === state.listId) ?? null;
}

/** 買い物リストでその分量を出すかどうか。調味料は既定で出さない。 */
function showQuantity(item) {
  if (!item.quantity) return false;
  if (item.category !== "調味料") return true;
  return state.data.settings.seasoningQuantity;
}

function defaultName(existing) {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const base = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  if (!existing.includes(base)) return base;
  return `${base} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

const ROUTE_COLORS = ["var(--route-1)", "var(--route-2)", "var(--route-3)", "var(--route-4)", "var(--route-5)"];

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function toast(message) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const node = el(`<div class="toast">${escapeHtml(message)}</div>`);
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 2600);
}

/** こんだては「読み込んだ順」で見せたいので、リストに順番を持たせておく。 */
function listMenu(list) {
  const used = new Set(list.items.flatMap((i) => i.recipes ?? []));
  const ordered = (list.menu ?? []).filter((name) => used.has(name));
  const rest = [...used].filter((name) => !ordered.includes(name));
  return [...ordered, ...rest];
}

              ${showQuantity(item) ? `<span class="qty num"> — ${escapeHtml(item.quantity)}</span>` : ""}
              ${item.recipes?.length ? `<div class="from">${escapeHtml(item.recipes.join("・"))}</div>` : ""}
              ${suspect ? `<button class="fix" data-fix="${item.id}" data-value="${escapeHtml(suspect)}">分数の読み違いかも　<b class="num">${escapeHtml(suspect)}</b> に直す</button>` : ""}
            </span>
            <button class="kill" data-kill="${item.id}" aria-label="削除">✕</button>
          </div>`;
        }).join("");

        return `
          <div class="section-head">
            <span class="route num" style="background:${ROUTE_COLORS[index] ?? "var(--ink-faint)"}">${index + 1}</span>
            <h2>${escapeHtml(category)}</h2>
            <span class="count num">${items.filter((i) => !i.checked).length} / ${items.length}</span>
          </div>
          <div class="card">${rows}</div>`;
      }).join("");

    app.innerHTML = `
      ${menu.length ? `
        <div class="card menu-card" style="margin-top:16px">
          <h2>こんだて</h2>
          <ul>${menu.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>
        </div>` : ""}
      ${sections}
      <p style="font-size:12px;color:var(--ink-faint);text-align:center;margin-top:22px">
        番号は売り場を回る順です
      </p>`;

    app.querySelectorAll("[data-fix]").forEach((button) => {
      button.onclick = (event) => {
        event.stopPropagation();
        const item = list.items.find((i) => i.id === button.dataset.fix);
        item.quantity = button.dataset.value;
        save();
        renderList();
        toast("分量を直しました");
      };
    });

    app.querySelectorAll(".item").forEach((row) => {
      row.onclick = (event) => {
        if (event.target.dataset.kill) return;
        if (event.target.closest("[data-fix]")) return;
        const item = list.items.find((i) => i.id === row.dataset.id);
        item.checked = !item.checked;
        save();
        renderList();
      };
    });
    app.querySelectorAll("[data-kill]").forEach((button) => {
      button.onclick = () => {
        list.items = list.items.filter((i) => i.id !== button.dataset.kill);
        save();
        renderList();
      };
    });
  }

  document.getElementById("back").onclick = () => go("home");
  document.getElementById("more").onclick = openListMenu;
  app.querySelector("#add-recipe")?.addEventListener("click", () => go("import"));

  renderBottom(`
    <button class="primary" id="b-recipe">レシピを貼り付ける</button>
    <button id="b-one">1品だけ追加</button>`);
  document.getElementById("b-recipe").onclick = () => go("import");
  document.getElementById("b-one").onclick = openAddOne;
}

function renderBottom(html) {
  const bar = el(`<div class="bottom"><div class="inner">${html}</div></div>`);
  document.getElementById("overlay").appendChild(bar);
}

function sheet(title, bodyHtml) {
  const back = el(`
    <div class="sheet-back">
      <div class="sheet">
        <h2>${escapeHtml(title)}</h2>
        ${bodyHtml}
      </div>
    </div>`);
  back.onclick = (event) => { if (event.target === back) back.remove(); };
  document.body.appendChild(back);
  return back;
}

function openListMenu() {
  const list = currentList();
  const back = sheet(list.name, `
    <button id="m-rename">名前を変更</button>
    <button id="m-season">${state.data.settings.seasoningQuantity ? "調味料の分量を隠す" : "調味料の分量を表示する"}</button>
    <button id="m-recalc">分量を計算し直す</button>
    <button id="m-copy">リストをコピー</button>
    <button id="m-clear">チェック済みを削除</button>
    <button class="danger" id="m-delete">このリストを削除</button>
    <button class="ghost" id="m-close">閉じる</button>`);

  const close = () => back.remove();
  back.querySelector("#m-close").onclick = close;

  back.querySelector("#m-rename").onclick = () => {
    close();
    const input = sheet("名前を変更", `
      <input type="text" id="r-name" value="${escapeHtml(list.name)}">
      <div class="row-actions"><button class="primary" id="r-ok" style="flex:1">保存</button></div>`);
    const field = input.querySelector("#r-name");
    field.focus();
    field.select();
    input.querySelector("#r-ok").onclick = () => {
      const value = field.value.trim();
      if (value) { list.name = value; save(); }
      input.remove();
      renderList();
    };
  };

  back.querySelector("#m-season").onclick = () => {
    state.data.settings.seasoningQuantity = !state.data.settings.seasoningQuantity;
    save();
    close();
    renderList();
  };

  back.querySelector("#m-recalc").onclick = () => {
    const merged = mergeIngredients(list.items.map((i) => ({
      name: i.name, quantity: i.quantity, category: i.category, recipes: i.recipes ?? [],
    })));
    const checked = new Set(list.items.filter((i) => i.checked).map((i) => normalizeName(i.name)));
    list.items = merged.map((item, index) => ({
      id: uid(), ...item, checked: checked.has(normalizeName(item.name)), order: index,
    }));
    save();
    close();
    renderList();
    toast("分量を計算し直しました");
  };

  back.querySelector("#m-copy").onclick = async () => {
    const text = [
      list.name,
      ...CATEGORIES.filter((c) => list.items.some((i) => i.category === c)).flatMap((category) => [
        "",
        `[${category}]`,
        ...list.items.filter((i) => i.category === category)
          .map((i) => `${i.checked ? "✓" : "・"} ${i.name}${i.quantity ? `（${i.quantity}）` : ""}`),
      ]),
    ].join("\n");

    try {
      await navigator.clipboard.writeText(text);
      toast("コピーしました");
    } catch {
      toast("コピーできませんでした");
    }
    close();
  };

  back.querySelector("#m-clear").onclick = () => {
    list.items = list.items.filter((i) => !i.checked);
    save();
    close();
    renderList();
  };

  back.querySelector("#m-delete").onclick = () => {
    state.data.lists = state.data.lists.filter((l) => l.id !== list.id);
    save();
    close();
    go("home");
  };
}

function openAddOne() {
  const options = CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("");
  const back = sheet("1品だけ追加", `
    <div class="field"><label>品名</label><input type="text" id="a-name" placeholder="トイレットペーパー"></div>
    <div class="field"><label>分量（任意）</label><input type="text" id="a-qty" placeholder="1袋"></div>
    <div class="field"><label>売り場</label><select id="a-cat" style="padding:9px">${options}</select></div>
    <div class="row-actions">
      <button class="ghost" id="a-cancel">キャンセル</button>
      <button class="primary" id="a-ok" style="flex:1">追加</button>
    </div>`);

  const nameField = back.querySelector("#a-name");
  const catField = back.querySelector("#a-cat");
  nameField.focus();
  nameField.oninput = () => { catField.value = categorize(nameField.value); };

  back.querySelector("#a-cancel").onclick = () => back.remove();
  back.querySelector("#a-ok").onclick = () => {
    const name = nameField.value.trim();
    if (!name) { nameField.focus(); return; }
    addItems([{
      name,
      quantity: back.querySelector("#a-qty").value.trim(),
      category: catField.value,
      recipes: [],
    }]);

    renderList();

function renderImport() {
  document.getElementById("bar").innerHTML = `
    <button class="icon" id="back" aria-label="戻る">‹</button>
    <h1>レシピを貼り付ける</h1>`;

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="stack" style="margin-top:16px">
      <div class="card pad stack">
        <div class="field">
          <label>レシピの文章</label>
          <textarea id="src" placeholder="レシピのページをSafariで開いて、材料のところを選択してコピー。ここに貼り付けてください。

写真のレシピなら、写真の中の文字を長押しすると選択できます。"></textarea>
        </div>
        <div class="row-actions">
          <button class="primary" id="run" style="flex:2 1 60%">材料を取り出す</button>
          <button id="paste">貼り付け</button>
        </div>
      </div>
      <div class="note">
        「材料」から「作り方」までの間だけを読み取ります。広告や関連レシピが混ざっていても大丈夫です。
      </div>
      <p class="report">
        うまく取り出せないときは <button class="link" id="copy-src">この文章を送る</button> を押して、
        メールやAirDropで知らせてください。読み取られた文章そのものがあれば直せます。<br>
        <span class="num">版 ${BUILD}</span>
      </p>
    </div>
    <div id="draft-area"></div>`;

  document.getElementById("back").onclick = () => go("list");
  document.getElementById("run").onclick = runExtract;

  // 不具合の報告には、読み取られた文章そのものが要る。手で写させない。
  //
  // 報告する人と、直す人の端末は別のことが多い。iPhoneで読み取ってパソコンで書く、
  // という往復ができるように、コピーではなく共有シートを開く。
  // AirDrop・メール・メモ、どれでも同じ文章がそのまま渡る。
  document.getElementById("copy-src").onclick = async (event) => {
    const text = document.getElementById("src").value.trim();
    if (!text) return;
    const label = event.target;
    const payload = `--- レシピかご 版 ${BUILD} ---\n${text}`;

    if (navigator.share) {
      try {
        await navigator.share({ title: "レシピかご 読み取り結果", text: payload });
        return;
      } catch {
        // 共有を取り消した場合も、下のコピーに落とす。
      }
    }

    try {
      await navigator.clipboard.writeText(payload);
      label.textContent = "コピーしました";
    } catch {
      document.getElementById("src").select();
      label.textContent = "選択しました（コピーを押してください）";
    }
    setTimeout(() => { label.textContent = "この文章を送る"; }, 2500);
  };

  document.getElementById("paste").onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        document.getElementById("src").value = text;
        runExtract();
      } else {
        toast("クリップボードが空です");
      }
    } catch {
      toast("読み取れませんでした。手で貼り付けてください");
    }
  };
}

/** ショートカットから複数のレシピをまとめて受け取るときの区切り。 */
const RECIPE_SEPARATOR = "@@@RECIPE@@@";

/** 文章を1つ以上のレシピに分けて、下書きの形にする。 */
function buildDraft(raw) {
  const chunks = raw.split(RECIPE_SEPARATOR).map((c) => c.trim()).filter(Boolean);

  const recipes = chunks.map((chunk, index) => {
    const recipe = extractRecipe(chunk, `レシピ ${index + 1}`);
    return {
      id: uid(),
      dishName: recipe.dishName,
      warn: !recipe.foundSection,
      rows: recipe.ingredients.map((item) => ({ ...item, id: uid(), use: true })),
    };
  }).filter((recipe) => recipe.rows.length > 0);

  return recipes.length > 0 ? { recipes } : null;
}

function runExtract() {
  const raw = document.getElementById("src").value;
  if (!raw.trim()) { toast("レシピの文章を貼り付けてください"); return; }

  const draft = buildDraft(raw);

  if (!draft) {
    toast("材料を見つけられませんでした");
    document.getElementById("draft-area").innerHTML = `
      <div class="card pad" style="margin-top:12px">
        <label>見つかりませんでした</label>
        <ol class="steps" style="margin-top:8px">
          <li><b>「材料」という見出しごと</b>コピーできているか確認してください</li>
          <li>ページ全体をコピーしても構いません</li>
          <li>それでも駄目なら、下の「1品だけ追加」から手で入れられます</li>
        </ol>
      </div>`;
    return;
  }

  state.draft = draft;
  renderDraft();
}

function findRow(id) {
  for (const recipe of state.draft.recipes) {
    const row = recipe.rows.find((r) => r.id === id);
    if (row) return row;
  }
  return null;
}

function renderDraft() {
  const draft = state.draft;
  const many = draft.recipes.length > 1;
  const options = (selected) => CATEGORIES
    .map((c) => `<option value="${c}" ${c === selected ? "selected" : ""}>${c}</option>`)
    .join("");

  const sections = draft.recipes.map((recipe, index) => {
    const rows = recipe.rows.map((row) => {
      // 「½缶」が「12缶」と読まれることがある。当てはまる行だけ知らせて、押せば直る。
      const suspect = row.use ? suspectFraction(row.quantity) : null;
      return `
      <div class="draft ${row.use ? "" : "off"}" data-id="${row.id}">
        <button class="box" data-use="${row.id}" aria-label="この材料を使う"
                style="${row.use ? "background:var(--accent);border-color:var(--accent);color:var(--accent-ink)" : ""}">✓</button>
        <div class="fields">
          <input type="text" value="${escapeHtml(row.name)}" data-field="name" aria-label="材料名">
          <div class="sub">
            <input type="text" class="num" value="${escapeHtml(row.quantity)}" data-field="quantity" placeholder="分量" aria-label="分量">
            <select data-field="category" aria-label="売り場">${options(row.category)}</select>
          </div>
          ${suspect ? `<button class="fix" data-fix="${row.id}" data-value="${escapeHtml(suspect)}">分数の読み違いかも　<b class="num">${escapeHtml(suspect)}</b> に直す</button>` : ""}
        </div>
      </div>`;
    }).join("");

    return `
      ${recipe.warn ? `<div class="note">「材料」の見出しが見つからなかったので、全体から拾いました。余分なものが混ざっていないか確認してください。</div>` : ""}
      <div class="card pad field">
        <label>こんだて（料理名）${many ? ` — ${index + 1} / ${draft.recipes.length}` : ""}</label>
        <input type="text" data-dish="${recipe.id}" value="${escapeHtml(recipe.dishName)}">
      </div>
      <div class="section-head" style="padding-bottom:4px">
        <h2>取り出した材料</h2>
        <span class="count num">${recipe.rows.filter((r) => r.use).length} / ${recipe.rows.length}</span>
      </div>
      <div class="card">${rows}</div>`;
  }).join("");

  document.getElementById("draft-area").innerHTML = `
    <div class="stack" style="margin-top:16px">${sections}</div>`;

  const area = document.getElementById("draft-area");

  area.querySelectorAll("[data-use]").forEach((button) => {
    button.onclick = () => {
      const row = findRow(button.dataset.use);
      row.use = !row.use;
      renderDraft();
    };
  });

  area.querySelectorAll("[data-fix]").forEach((button) => {
    button.onclick = () => {
      findRow(button.dataset.fix).quantity = button.dataset.value;
      renderDraft();
    };
  });

  area.querySelectorAll(".draft").forEach((node) => {
    const row = findRow(node.dataset.id);
    node.querySelectorAll("[data-field]").forEach((input) => {
      input.oninput = () => {
        row[input.dataset.field] = input.value;
        if (input.dataset.field === "name") {
          const select = node.querySelector("[data-field=category]");
          select.value = categorize(input.value);
          row.category = select.value;
        }
      };
    });
  });

  area.querySelectorAll("[data-dish]").forEach((input) => {
    const recipe = draft.recipes.find((r) => r.id === input.dataset.dish);
    input.oninput = () => { recipe.dishName = input.value; };
  });

  const total = draft.recipes.reduce((sum, r) => sum + r.rows.filter((x) => x.use).length, 0);

  document.getElementById("overlay").innerHTML = "";
  renderBottom(`
    <button id="d-cancel">やめる</button>
    <button class="primary" id="d-ok" style="flex:2">${total}品をリストに追加</button>`);

  document.getElementById("d-cancel").onclick = () => { state.draft = null; go("list"); };
  document.getElementById("d-ok").onclick = () => {
    const chosen = draft.recipes.flatMap((recipe) => {
      const dish = recipe.dishName.trim() || "レシピ";
      return recipe.rows
        .filter((r) => r.use && r.name.trim())
        .map((r) => ({
          name: r.name.trim(),
          quantity: r.quantity.trim(),
          category: r.category,
          recipes: [dish],
        }));
    });

    if (chosen.length === 0) { toast("追加する材料がありません"); return; }

    addItems(chosen);
    state.draft = null;
    go("list");
    toast(`${chosen.length}品を追加しました`);
  };
}

/** 既存の品目と新しい材料をまとめ直して、リストを作り直す。 */
function addItems(ingredients) {
  const list = currentList();

  list.menu ??= [];
  for (const name of ingredients.flatMap((i) => i.recipes ?? [])) {
    if (!list.menu.includes(name)) list.menu.push(name);
  }

  const existing = list.items.map((i) => ({
    name: i.name, quantity: i.quantity, category: i.category, recipes: i.recipes ?? [],
  }));
  const checked = new Set(list.items.filter((i) => i.checked).map((i) => normalizeName(i.name)));

  list.items = mergeIngredients([...existing, ...ingredients]).map((item, index) => ({
    id: uid(),
    ...item,
    checked: checked.has(normalizeName(item.name)),
    order: index,
  }));
  save();
}

// ===========================================================================
// 画面の切り替え
// ===========================================================================

/**
 * ショートカットから受け取る入り口。
 *
 * 「画像からテキストを抽出」で読んだ文章をBase64にして
 * #r=... の形で渡してもらう。#より後ろはサーバーへ送られないので、
 * この方法なら通信をせずに端末の中だけで受け渡しできる。
 */
function importFromHash() {
  const match = location.hash.match(/[#&]r=([^&]+)/);
  if (!match) return false;

  // 一度読んだら消す。再読み込みで二重に取り込まないため。
  history.replaceState(null, "", location.pathname + location.search);

  let text;
  try {
    const base64 = decodeURIComponent(match[1]).replace(/\s/g, "");
    const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
    text = new TextDecoder().decode(bytes);
  } catch {
    toast("受け取った内容を読めませんでした");
    return false;
  }

  const draft = buildDraft(text);
  if (!draft) {
    toast("材料を見つけられませんでした");
    return false;
  }

  // 今日のリストがあればそこへ、無ければ新しく作る。
  const today = defaultName([]).slice(0, 10);
  const existing = state.data.lists.find((l) => l.name.startsWith(today));
  if (existing) {
    state.listId = existing.id;
  } else {
    createList();
  }

  state.draft = draft;
  state.screen = "import";
  renderImport();
  document.getElementById("src").value = text;
  renderDraft();
  return true;
}

/**
 * クリップボード経由で受け取る道。
 *
 * URLに載せる方法は手軽だが、長い文章だと途中で切れることがある。
 * クリップボードには長さの制限がないので、切れて困る場面はこちらを使う。
 * Safariは合図なしにクリップボードを読めないので、一度押してもらう形にする。
 */
function openClipboardImport() {
  if (!/[#&]clip(\b|$)/.test(location.hash)) return false;
  history.replaceState(null, "", location.pathname + location.search);

  const today = defaultName([]).slice(0, 10);
  const existing = state.data.lists.find((l) => l.name.startsWith(today));
  if (existing) state.listId = existing.id;
  else createList();

  state.screen = "import";
  renderImport();
  document.getElementById("draft-area").innerHTML = `
    <div class="card pad stack" style="margin-top:16px">
      <p class="note">レシピの文章がコピーされています。下を押すと取り込みます。</p>
      <button class="primary" id="from-clip">クリップボードから取り込む</button>
    </div>`;
  document.getElementById("from-clip").onclick = () => document.getElementById("paste").click();
  return true;
}

function go(screen) {
  state.screen = screen;
  document.getElementById("overlay").innerHTML = "";
  document.querySelectorAll(".sheet-back").forEach((s) => s.remove());
  window.scrollTo(0, 0);

  if (screen === "home") renderHome();
  else if (screen === "list") renderList();
  else if (screen === "import") renderImport();
}

if (!importFromHash() && !openClipboardImport()) go("home");

// Safariに同じページのタブが残っていると、#より後ろだけ変えても再読み込みされない。
// ショートカットから二度目に送ったとき、取り込みが始まらないのを防ぐ。
window.addEventListener("hashchange", () => {
  if (importFromHash()) return;
  openClipboardImport();
});
</script>
